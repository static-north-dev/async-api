name: Verify

on:
  workflow_call:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASYNCAPI_TEST_CONFIGURATION: Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: dotnet build StaticNorth.AsyncApi.slnx --configuration Release
      - run: dotnet format StaticNorth.AsyncApi.slnx --verify-no-changes --no-restore
        env:
          Configuration: Release
      - run: dotnet test --solution StaticNorth.AsyncApi.slnx --configuration Release --no-build --no-restore
      - run: npm --prefix tests/compatibility ci --ignore-scripts
      - run: npm --prefix tests/compatibility test
      - run: npm --prefix samples/WebProducer/Viewer ci --ignore-scripts
      - run: npm --prefix tests/compatibility exec -- playwright install --with-deps --only-shell chromium
      - run: dotnet publish samples/WebProducer --configuration Release --no-restore -p:AsyncApiEnableViewer=true --output '${{ runner.temp }}/asyncapi-viewer'
      - run: npm --prefix tests/compatibility run test:viewer
        env:
          ASYNCAPI_WEB_PRODUCER_DLL: ${{ runner.temp }}/asyncapi-viewer/WebProducer.dll
      - run: dotnet pack StaticNorth.AsyncApi.slnx --configuration Release --no-build --no-restore --output artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
