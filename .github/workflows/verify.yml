name: Verify

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: dotnet build StaticNorth.AsyncApi.slnx
      - run: dotnet format StaticNorth.AsyncApi.slnx --verify-no-changes --no-restore
      - run: dotnet test --solution StaticNorth.AsyncApi.slnx --no-build --no-restore
      - run: npm --prefix tests/compatibility ci --ignore-scripts
      - run: npm --prefix tests/compatibility test
